
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品詳細介紹｜夢想大拍檔</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #F5F0E8;
            color: #333;
        }

        .作品頁 {
            max-width: 1100px;
            margin: 50px auto;
            padding: 30px;
        }

        .返回按鈕 {
            display: inline-block;
            margin-bottom: 25px;
            text-decoration: none;
            color: #333;
        }

        .作品標題 {
            text-align: center;
            margin-bottom: 40px;
        }

        .作品標題 h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .內容框 {
            background: white;
            padding: 30px;
            margin-bottom: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .圖片框 {
            width: 100%;
            min-height: 250px;
            background: #EAE5DC;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .圖片框 img {
            width: 100%;
            height: auto;
            display: block;
        }

        .文字框 {
            min-height: 100px;
            line-height: 1.8;
        }

        @media (max-width: 600px) {
            .作品頁 {
                padding: 18px;
                margin: 20px auto;
            }

            .內容框 {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

    <main class="作品頁">

        <!-- 返回首頁 -->
        <a class="返回按鈕" href="index.html">
            ← 返回首頁
        </a>

        <!-- 作品標題 -->
        <header class="作品標題">
            <h1>作品詳細介紹</h1>
            <p>Dream Partner｜2026 畢業成果展</p>
        </header>

        <!-- 區塊一：作品介紹 -->
        <section class="內容框">
            <h2>一、作品介紹</h2>

            <div class="文字框">
                <p>作品介紹</p>
            </div>
        </section>

        <!-- 區塊二：作品圖片 -->
        <section class="內容框">
            <h2>二、作品圖片</h2>

            <div class="圖片框">
                <!-- 將圖片放進 images 資料夾後，修改圖片路徑 -->
                <img src="images/work01.jpg"
                     alt="作品圖片">
            </div>
        </section>

        <!-- 區塊三：作品影片 -->
        <section class="內容框">
            <h2>三、作品影片</h2>

            <div class="文字框">
                <p>請在這裡放入影片連結或影片介紹……</p>
            </div>
        </section>

        <!-- 區塊四：製作團隊 -->
        <section class="內容框">
            <h2>四、製作團隊</h2>

            <div class="文字框">
                <p>導演：</p>
                <p>企劃：</p>
                <p>攝影：</p>
                <p>剪輯：</p>
            </div>
        </section>

    </main>

</body>
</html>
